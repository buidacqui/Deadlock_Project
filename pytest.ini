[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    valid_path:    Nhóm 1 — Valid Path tests (S0→S5, không cần browser)
    deadlock_path: Nhóm 2 — Deadlock Detection tests (→S6, không cần browser)
    boundary:      Nhóm 3 — Boundary State tests (không cần browser)
    concurrent:    Nhóm 4 — Concurrent multi-session tests (không cần browser)
    fsm_only:      Chỉ FSM Engine — không cần Juice Shop chạy
    ui:            UI tests — yêu cầu Juice Shop tại localhost:3000

addopts =
    -v
    --tb=short
    --color=yes
    -p no:warnings
    --timeout=30

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
