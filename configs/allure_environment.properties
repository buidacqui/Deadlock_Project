Application=OWASP Juice Shop
Base.URL=http://localhost:3000
Framework=Python 3.11 + pytest + Playwright
FSM.States=8 (S0-guest, S1-authenticated, S2-cart_active, S3-checkout, S4-processing, S5-confirmed, S6-deadlock, S7-expired)
Property.Verified=AG(not_deadlock)
Total.TC.FSM=32
Total.TC.UI=6
DDT.Sheets=Valid_Path / Deadlock_Path / Boundary_State / Concurrent
Deadlock.Detection=DFS Cycle Detection on Wait-For Graph
